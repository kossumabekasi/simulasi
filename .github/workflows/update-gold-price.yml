name: Perbarui harga buyback Antam

on:
  schedule:
    - cron: '15 1-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ambil harga terbaru
        run: node scripts/update-gold-price.mjs
      - name: Simpan perubahan
        run: |
          if git diff --quiet; then
            echo "Harga belum berubah"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold-price.json
          git commit -m "Perbarui harga buyback Antam"
          git push
